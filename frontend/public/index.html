    <meta name="theme-color" content="#000000" />
    <meta
  name="description"
  content="Find good first issues to contribute to open source projects. Filter by programming language and discover beginner-friendly issues to start your open source journey."
/>
<meta name="keywords" content="good first issue, open source, GitHub, beginner, contribute, programming" />
<meta name="author" content="Club Gamma" />

<!-- Open Graph tags for social media sharing -->

<meta property="og:url" content="https://good-first-issue-web-app.vercel.app/" />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Good First Issue - Club Gamma" />

    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <!-- More descriptive than just "Club Gamma (GFI)" -->
    <title>Good First Issue Finder | Club Gamma - Start Your Open Source Journey</title>

    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
     <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
 <!-- Performance Optimization -->
    <link rel="preconnect" href="https://api.github.com" />
    <link rel="dns-prefetch" href="https://api.github.com" />
